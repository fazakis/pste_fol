[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pste-fol-reproducibility"
version = "2.0.0"
description = "Inductive confidence-gated PSTE and Fast Outward Ladder implementation with locked KBS reproducibility assets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "imbalanced-learn>=0.13",
  "imbalanced-learn-extra>=0.2.10",
  "joblib>=1.4",
]

[project.optional-dependencies]
paper = [
  "torch==2.11.0",
]
dev = [
  "pytest>=8",
]

[project.urls]
Repository = "https://github.com/fazakis/pste_fol"

[tool.setuptools.packages.find]
include = ["pste_fol*"]
